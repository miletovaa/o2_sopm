services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sopm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sopm}
      POSTGRES_DB: ${POSTGRES_DB:-sopm}
    ports:
      # Bound to localhost only — the DB should never be reachable from the
      # public internet. Use `ssh -L 5433:localhost:5433 <server>` to reach
      # it from your own machine (e.g. for psql/pg_dump) when needed.
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sopm}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sopm}:${POSTGRES_PASSWORD:-sopm}@db:5432/${POSTGRES_DB:-sopm}?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      UPLOADS_DIR: ./uploads
    volumes:
      - ./uploads:/app/uploads
    ports:
      # Only exposed on localhost — Caddy is what the outside world talks
      # to; it terminates TLS and proxies to the app over the internal
      # compose network (see Caddyfile).
      - "127.0.0.1:3000:3000"

  # One-off jobs, not part of the long-running stack. Run with e.g.:
  #   docker compose run --rm migrate npx prisma migrate deploy
  #   docker compose run --rm migrate npx prisma db seed
  migrate:
    build:
      context: .
      target: builder
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sopm}:${POSTGRES_PASSWORD:-sopm}@db:5432/${POSTGRES_DB:-sopm}?schema=public
      SEED_EMPLOYEE_PASSWORD: ${SEED_EMPLOYEE_PASSWORD}
      SEED_STUDENT_PASSWORD: ${SEED_STUDENT_PASSWORD}
    entrypoint: []
    command: ["true"]

  # No embedded Caddy here — this VPS also hosts a second, unrelated site
  # (org_dma), so ONE shared Caddy instance (outside both projects, see the
  # deploy guide's "edge" setup) owns the public 80/443 ports and reverse
  # proxies to this app's 127.0.0.1:3000 above. Caddyfile/selfsigned.crt/key
  # in this repo are kept for local single-site deployments but aren't used
  # in the shared-VPS setup.

volumes:
  db_data:
